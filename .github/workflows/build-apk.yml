name: Build MYRAA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Copy native plugin files
        run: |
          mkdir -p android/app/src/main/java/ai/myraa/mobile/plugins
          cp android-integration/ScreenSharePlugin.java android/app/src/main/java/ai/myraa/mobile/plugins/
          cp android-integration/DeviceControlPlugin.java android/app/src/main/java/ai/myraa/mobile/plugins/
          cp android-integration/DeviceControlAccessibilityService.java android/app/src/main/java/ai/myraa/mobile/plugins/
          cp android-integration/MyraaNativePlugin.java android/app/src/main/java/ai/myraa/mobile/plugins/
          cp android-integration/GeminiLiveClient.java android/app/src/main/java/ai/myraa/mobile/plugins/
          cp android-integration/DeviceActionExecutor.java android/app/src/main/java/ai/myraa/mobile/plugins/
          cp android-integration/MyraaForegroundService.java android/app/src/main/java/ai/myraa/mobile/plugins/
          cp android-integration/MyraaServiceCoordinator.java android/app/src/main/java/ai/myraa/mobile/plugins/
          mkdir -p android/app/src/main/res/xml
          cp android-integration/accessibility_service_config.xml android/app/src/main/res/xml/
          echo "--- verifying files landed ---"
          ls -la android/app/src/main/java/ai/myraa/mobile/plugins/

      - name: Add OkHttp dependency
        run: python3 scripts/patch_build_gradle.py

      - name: Patch AndroidManifest.xml
        run: python3 scripts/patch_manifest.py

      - name: Patch strings.xml
        run: python3 scripts/patch_strings.py

      - name: Register plugins in MainActivity
        run: python3 scripts/patch_main_activity.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myraa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
